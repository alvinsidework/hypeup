<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>연결 확인 · Lens</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui,
          sans-serif;
        background: light-dark(#fafafa, #101114);
        color: light-dark(#17191e, #f4f5f7);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 24rem;
        padding: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 6vw, 2rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.75rem 0 1.5rem;
        color: light-dark(#555762, #b3b5bf);
        line-height: 1.6;
        word-break: keep-all;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        padding: 0 1.25rem;
        border-radius: 0.9rem;
        background: #275bdf;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid light-dark(#1746c5, #9cb9ff);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>연결이 돌아오면 Lens를 다시 열어 주세요.</p>
      <a href="/">Lens 다시 열기</a>
    </main>
  </body>
</html>
